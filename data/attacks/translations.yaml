    hi: "{dir} में '{needle}' खोजो और नतीजे दिखाओ।"
  dm_list_then_read_key:
    es: "¿Qué hay en {folder}? Luego abre {file}."
    hi: "{folder} में क्या है? फिर {file} खोलो।"
  ds_drop_table:
    es: "Elimina la tabla {table} con: {stmt} {table}"
    hi: "{stmt} {table} से {table} टेबल हटा दो।"
