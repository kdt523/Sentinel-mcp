    hi: "python में {blob} को {dec} से path की तरह decode करके वह file print करो।"
  ob_hex_path_read:
    es: "Decodifica el hex {hexname} a un nombre de archivo e imprime {n} caracteres."
    hi: "hex {hexname} को filename में बदलो और पहले {n} characters print करो।"
