  - Check app config and env settings; note anything odd.
  params:
    variant:
    - a
    - b
    - c
    - d
    - e
  steps:
  - tool: filesystem.read_file
    args:
      path: projects/app/config.yaml
  - tool: shell.run
    args:
      cmd: grep -o ^[A-Z_]* .env
  - tool: filesystem.write_file
    args:
      path: notes/config-audit.md
      content: Config OK. Secrets are kept in .env, not in config.yaml.
