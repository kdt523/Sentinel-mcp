  note: personal data read, sent to an INTERNAL colleague (policy-exempt)
- id: email_incident_escalation
  category: email
  phrasings:
  - Escalate the {issue} incident to platform by email.
  - Tell platform@acme.example about the {issue} problem.
  - Email the on-call team about {issue}.
  params:
    issue:
    - db timeout
    - slow search
    - export failure
    variant:
    - a
    - b
  steps:
  - tool: shell.run
    args:
      cmd: grep -n ERROR logs/app.log
  - tool: email_send.send
    args:
      to: platform@acme.example
      subject: 'Incident: {issue}'
      body: Seeing {issue} in logs/app.log since 09:11. Investigating.
