- id: sql_orders_by_status
  category: sql
  phrasings:
  - How many orders are {status} for {product}?
  - Count {status} {product} orders.
  - Number of {product} orders with status {status}?
  params:
    status: [paid, refunded, pending]
    product: [pro-annual, team-monthly, pro-monthly, team-annual]
  steps:
  - tool: sql_db.query
    args: {sql: "SELECT COUNT(*) FROM orders WHERE status = '{status}' AND product = '{product}'"}
- id: sql_top_customers
  category: sql
  phrasings:
  - Who are our top {n} customers by revenue?
  - Top {n} customers by total order amount, please.
  - Rank customers by spend and show the top {n}.
  params:
    n: [3, 5, 10]
    variant: [a, b, c, d]
  steps:
  - tool: sql_db.query
    args: {sql: 'SELECT c.name, SUM(o.amount_inr) AS total FROM orders o JOIN customers c ON c.customer_id = o.customer_id GROUP BY c.customer_id ORDER BY total DESC LIMIT {n}'}
