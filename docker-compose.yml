# SentinelMCP local stack. Phase 0: storage services only.
# Gateway, tool servers, guard, monitoring and dashboard are added in later phases.

name: sentinel-mcp

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # Local development credentials only (fake). Override via .env.
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Shell tool server. Single source of truth for its hardening. Default transport: MCP
  # streamable HTTP on a 0600 Unix socket in the dedicated `shell-sock` volume (the container
  # has no network). Tests may also start it over stdio:
  #   docker compose run --rm -T -e SHELL_TRANSPORT=stdio shell
  # Profile keeps it out of `make dev` until the gateway is wired in.
  shell:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: tools_servers/shell/Dockerfile
    image: sentinel-mcp/shell:dev
    stdin_open: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    ulimits:
      nofile: { soft: 256, hard: 256 }
      fsize: 10485760  # max 10 MiB per written file
    environment:
      SANDBOX_SHELL_ALLOWLIST: ${SANDBOX_SHELL_ALLOWLIST:-ls,cat,grep,wc,head,echo,date,python3}
      SHELL_TRANSPORT: ${SHELL_TRANSPORT:-uds}
      SHELL_SOCKET_PATH: /run/sentinel-shell/shell.sock
    volumes:
      - ${SHELL_SANDBOX_DIR:-./sandbox_runtime/fs}:/sandbox
      - shell-sock:/run/sentinel-shell
    healthcheck:
      test: ["CMD", "python", "-c", "import os,stat,sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/run/sentinel-shell/shell.sock').st_mode) else 1)"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Test-only client container: same image and uid, no network, mounts ONLY the socket volume.
  # Runs a Python script from stdin (used to verify gateway/transports.py end to end).
  shell-probe:
    profiles: ["test"]
    image: sentinel-mcp/shell:dev
    entrypoint: ["python", "-"]
    stdin_open: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_IN_CONTAINER: "0"
    volumes:
      - shell-sock:/run/sentinel-shell

volumes:
  redis-data:
  postgres-data:
  shell-sock:  # holds ONLY the shell server's Unix socket
