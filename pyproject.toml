[project]
name = "sentinel-mcp"
version = "0.1.0"
description = "Session-aware, bidirectional security gateway for MCP-based AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kdt523" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "sentinel-mcp[tools]",
    "aiosqlite>=0.20",  # async SQLite for decision-log unit tests
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "testcontainers>=4.8",
    "types-PyYAML",
]
# Operator tooling: in-memory Redis for `python -m gateway.policy dry-run`.
tools = [
    "fakeredis[lua]>=2.24",
]
# GPU-only extras: install on Colab/Kaggle/rented GPU, not on the laptop.
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "unsloth; sys_platform == 'linux'",
    "wandb>=0.18",
    "datasketch>=1.6",
]
serve = [
    "vllm; sys_platform == 'linux'",
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.23",
]
agents = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
]
ui = [
    "streamlit>=1.39",
    "pandas>=2.2",
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "gateway",
    "tools_servers",
    "agents",
    "data",
    "baselines",
    "training",
    "fast_tier",
    "serving",
    "eval",
    "dashboard",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
exclude = ['^notebooks/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["gateway", "gateway.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not attack and not gpu'"
markers = [
    "integration: needs docker compose services (redis, postgres, tool servers)",
    "attack: attack regression suite",
    "gpu: requires a CUDA GPU",
]
